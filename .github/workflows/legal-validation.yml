name: Legal repository validation

on:
  push:
    paths:
      - "legal/**"
      - ".github/workflows/legal-validation.yml"
  pull_request:
    paths:
      - "legal/**"
      - ".github/workflows/legal-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate legal documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate structure, metadata, formatting, and links
        run: node legal/scripts/validate-repository.mjs
